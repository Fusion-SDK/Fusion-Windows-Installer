
name: Fusion Windows CI

on:
  push:
    branches: [main, master]
    tags:
      - "Windows_v0.1.0"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fusion for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure Native Fusion Loader
        run: cmake -S src/Fusion.Loader.Native -B artifacts/FusionLoaderBuild -A x64

      - name: Build Native Fusion Loader
        run: cmake --build artifacts/FusionLoaderBuild --config Release --parallel
        
      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET Version
        run: dotnet --version

      - name: Restore Dependencies
        run: dotnet restore Fusion.sln

      - name: Build Solution
        run: dotnet build Fusion.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Fusion.sln --configuration Release --no-build

      # Publish the main Fusion application into AppPayload.
      - name: Publish Fusion Application
        run: |
          dotnet publish src/Fusion.Installer/Fusion.Installer.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o artifacts/Fusion-Package/AppPayload

      # Publish the custom WPF setup wizard separately.
      - name: Publish Fusion Setup Wizard
        run: |
          dotnet publish src/Fusion.Setup/Fusion.Setup.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o artifacts/Fusion-SetupHost

      - name: Assemble Installer Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/Fusion-Package" | Out-Null

          Copy-Item `
            "artifacts/Fusion-SetupHost/Fusion.Setup.exe" `
            "artifacts/Fusion-Package/Fusion.Setup.exe" `
            -Force

          if (!(Test-Path "artifacts/Fusion-Package/AppPayload")) {
            throw "Fusion application payload was not published."
          }

          if (!(Test-Path "artifacts/Fusion-Package/Fusion.Setup.exe")) {
            throw "Fusion setup wizard executable was not published."
          }

      # NSIS creates one self-extracting EXE containing both projects.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Create Fusion Installer
        shell: pwsh
        run: |
          $nsisScript = @'
          Unicode true
          Name "Fusion"
          OutFile "artifacts\Fusion-Setup.exe"
          SilentInstall silent
          RequestExecutionLevel user

          Section
            SetOutPath "$TEMP\FusionSetup"
            File /r "artifacts\Fusion-Package\*"
            ExecWait '"$TEMP\FusionSetup\Fusion.Setup.exe"'
            RMDir /r "$TEMP\FusionSetup"
          SectionEnd
          '@

          Set-Content -Path "Fusion-Setup.nsi" -Value $nsisScript -Encoding ASCII

          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"

          if (!(Test-Path $makensis)) {
            throw "NSIS compiler was not found."
          }

          & $makensis "Fusion-Setup.nsi"

          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installer compilation failed."
          }

          if (!(Test-Path "artifacts/Fusion-Setup.exe")) {
            throw "Fusion-Setup.exe was not generated."
          }

      # Keep the EXE available as a normal Actions artifact too.
      - name: Upload Fusion Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fusion-Windows-Installer
          path: artifacts/Fusion-Setup.exe
          if-no-files-found: error
          retention-days: 14

      # Automatically create a GitHub Release and attach the EXE.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Fusion-Setup.exe
          generate_release_notes: true
