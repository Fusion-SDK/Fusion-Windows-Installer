name: Fusion Windows CI

on:
  push:
    branches: [main, master]
    tags:
      - "Windows_v0.1.0"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fusion for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET Version
        run: dotnet --version

      - name: Restore Dependencies
        run: dotnet restore Fusion.sln

      - name: Build Solution
        run: dotnet build Fusion.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Fusion.sln --configuration Release --no-build

      # Use the same packaging script for local builds and CI so the installer
      # always receives the complete payload expected by Fusion.Setup.
      - name: Assemble Fusion Installer Payload
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisCandidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )

          $existingCompiler = $nsisCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($existingCompiler) {
            Write-Host "NSIS is already available at $existingCompiler"
            exit 0
          }

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Installing NSIS (attempt $attempt of $maxAttempts)..."
            choco install nsis --yes --no-progress --execution-timeout=300

            if ($LASTEXITCODE -eq 0) {
              $installedCompiler = $nsisCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
              if ($installedCompiler) {
                Write-Host "NSIS installed at $installedCompiler"
                exit 0
              }
            }

            if ($attempt -lt $maxAttempts) {
              $delay = 15 * $attempt
              Write-Warning "NSIS installation failed or compiler was not found. Retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }

          throw "NSIS installation failed after $maxAttempts attempts."

      - name: Create Fusion Installer
        shell: pwsh
        run: |
          $nsisScript = @'
          Unicode true
          Name "Fusion"
          OutFile "artifacts\Fusion-Setup.exe"
          SilentInstall silent
          RequestExecutionLevel user

          Section
            SetOutPath "$TEMP\FusionSetup"
            File /r "artifacts\Fusion-Package\*"
            ExecWait '"$TEMP\FusionSetup\Fusion.Setup.exe"'
            RMDir /r "$TEMP\FusionSetup"
          SectionEnd
          '@

          Set-Content -Path "Fusion-Setup.nsi" -Value $nsisScript -Encoding ASCII

          $compilerCommand = Get-Command "makensis.exe" -ErrorAction SilentlyContinue
          if ($compilerCommand) {
            $makensis = $compilerCommand.Source
          }
          else {
            $candidates = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (!$makensis) {
            throw "NSIS compiler was not found."
          }

          & $makensis "Fusion-Setup.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installer compilation failed."
          }

          if (!(Test-Path "artifacts/Fusion-Setup.exe")) {
            throw "Fusion-Setup.exe was not generated."
          }

      - name: Upload Fusion Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fusion-Windows-Installer
          path: artifacts/Fusion-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Fusion-Setup.exe
          generate_release_notes: true
